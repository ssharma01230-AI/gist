name: Tests

# Fast, hermetic pipeline tests (no network — they use fixtures). Runs on every
# push and PR so the ingestion/orchestration logic keeps working each change.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
