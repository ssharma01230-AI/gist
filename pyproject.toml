[project]
name = "gist-pipeline"
version = "0.1.0"
description = "Gist news pipeline: ingest -> queue -> store -> select -> create -> check -> deploy -> learn"
requires-python = ">=3.10"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
